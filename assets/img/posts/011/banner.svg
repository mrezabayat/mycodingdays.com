<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Historical cyberattacks banner</title>
  <desc id="desc">A custom banner showing four cyberattack eras from Brain in 1986 to Equifax in 2017.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="150" cy="80" r="120" fill="#1d4ed8" opacity="0.15"/>
  <circle cx="1070" cy="550" r="180" fill="#0ea5e9" opacity="0.12"/>

  <text x="600" y="82" text-anchor="middle" fill="#f8fafc" font-size="40" font-family="Verdana, sans-serif" font-weight="700">
    From Brain to Equifax
  </text>
  <text x="600" y="118" text-anchor="middle" fill="#cbd5e1" font-size="22" font-family="Verdana, sans-serif">
    Four cyberattacks that changed computing
  </text>

  <line x1="120" y1="520" x2="1080" y2="520" stroke="#7dd3fc" stroke-width="6" stroke-linecap="round"/>

  <g transform="translate(120 170)">
    <rect width="220" height="260" rx="22" fill="url(#panel)"/>
    <text x="26" y="42" fill="#0f172a" font-size="24" font-family="Verdana, sans-serif" font-weight="700">1986</text>
    <text x="26" y="74" fill="#1e3a8a" font-size="22" font-family="Verdana, sans-serif">Brain</text>
    <rect x="58" y="100" width="104" height="104" rx="10" fill="#1e293b"/>
    <rect x="78" y="118" width="64" height="26" fill="#f1f5f9"/>
    <rect x="78" y="151" width="64" height="33" fill="#f8d7da"/>
    <rect x="92" y="100" width="36" height="16" fill="#475569"/>
    <text x="26" y="232" fill="#334155" font-size="16" font-family="Verdana, sans-serif">Boot sector virus</text>
    <text x="26" y="254" fill="#334155" font-size="16" font-family="Verdana, sans-serif">shared by floppy disks</text>
  </g>

  <g transform="translate(370 170)">
    <rect width="220" height="260" rx="22" fill="url(#panel)"/>
    <text x="26" y="42" fill="#0f172a" font-size="24" font-family="Verdana, sans-serif" font-weight="700">1988</text>
    <text x="26" y="74" fill="#1e3a8a" font-size="22" font-family="Verdana, sans-serif">Morris Worm</text>
    <circle cx="64" cy="154" r="20" fill="#38bdf8"/>
    <circle cx="112" cy="120" r="20" fill="#38bdf8"/>
    <circle cx="156" cy="158" r="20" fill="#38bdf8"/>
    <circle cx="106" cy="194" r="20" fill="#38bdf8"/>
    <line x1="64" y1="154" x2="112" y2="120" stroke="#0f172a" stroke-width="5"/>
    <line x1="112" y1="120" x2="156" y2="158" stroke="#0f172a" stroke-width="5"/>
    <line x1="64" y1="154" x2="106" y2="194" stroke="#0f172a" stroke-width="5"/>
    <line x1="156" y1="158" x2="106" y2="194" stroke="#0f172a" stroke-width="5"/>
    <text x="110" y="230" text-anchor="middle" fill="#334155" font-size="16" font-family="Verdana, sans-serif">
      <tspan x="110" dy="0">Internet worm</tspan>
      <tspan x="110" dy="20">network trust failed</tspan>
    </text>
  </g>

  <g transform="translate(620 170)">
    <rect width="220" height="260" rx="22" fill="url(#panel)"/>
    <text x="26" y="42" fill="#0f172a" font-size="24" font-family="Verdana, sans-serif" font-weight="700">2000</text>
    <text x="26" y="74" fill="#1e3a8a" font-size="22" font-family="Verdana, sans-serif">ILOVEYOU</text>
    <rect x="44" y="108" width="132" height="88" rx="10" fill="#ffffff" stroke="#0f172a" stroke-width="4"/>
    <path d="M44 122 L110 164 L176 122" fill="none" stroke="#0f172a" stroke-width="4"/>
    <text x="78" y="156" fill="#dc2626" font-size="24" font-family="Verdana, sans-serif">L&lt;3</text>
    <text x="110" y="230" text-anchor="middle" fill="#334155" font-size="16" font-family="Verdana, sans-serif">
      <tspan x="110" dy="0">Email worm</tspan>
      <tspan x="110" dy="20">social engineering at scale</tspan>
    </text>
  </g>

  <g transform="translate(870 170)">
    <rect width="220" height="260" rx="22" fill="url(#panel)"/>
    <text x="26" y="42" fill="#0f172a" font-size="24" font-family="Verdana, sans-serif" font-weight="700">2017</text>
    <text x="26" y="74" fill="#1e3a8a" font-size="22" font-family="Verdana, sans-serif">Equifax</text>
    <rect x="56" y="104" width="108" height="86" rx="12" fill="#1e293b"/>
    <rect x="78" y="130" width="64" height="12" fill="#67e8f9"/>
    <rect x="78" y="152" width="46" height="12" fill="#67e8f9"/>
    <path d="M146 106 v-18 a18 18 0 0 0-36 0 v18" fill="none" stroke="#ef4444" stroke-width="6"/>
    <text x="110" y="230" text-anchor="middle" fill="#334155" font-size="16" font-family="Verdana, sans-serif">
      <tspan x="110" dy="0">Enterprise breach</tspan>
      <tspan x="110" dy="20">patching and governance</tspan>
    </text>
  </g>

  <g fill="#e0f2fe" font-family="Verdana, sans-serif" font-size="18" font-weight="700">
    <circle cx="230" cy="520" r="10"/>
    <circle cx="480" cy="520" r="10"/>
    <circle cx="730" cy="520" r="10"/>
    <circle cx="980" cy="520" r="10"/>
    <text x="206" y="555">1986</text>
    <text x="456" y="555">1988</text>
    <text x="706" y="555">2000</text>
    <text x="956" y="555">2017</text>
  </g>
</svg>
