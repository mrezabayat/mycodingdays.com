<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">Equifax breach chain diagram</title>
  <desc id="desc">A timeline-style diagram showing the Equifax breach from the Apache Struts disclosure to public disclosure in September 2017.</desc>
  <rect width="1100" height="620" fill="#f8fafc"/>
  <text x="550" y="56" text-anchor="middle" fill="#0f172a" font-size="30" font-family="Verdana, sans-serif" font-weight="700">
    Equifax was a failure chain, not a single mistake
  </text>

  <g transform="translate(70 142)">
    <rect width="170" height="120" rx="16" fill="#dbeafe" stroke="#1d4ed8" stroke-width="5"/>
    <text x="85" y="40" text-anchor="middle" fill="#1e3a8a" font-size="20" font-family="Verdana, sans-serif" font-weight="700">
      Mar 7, 2017
    </text>
    <text x="85" y="72" text-anchor="middle" fill="#0f172a" font-size="17" font-family="Verdana, sans-serif">
      Struts flaw
    </text>
    <text x="85" y="96" text-anchor="middle" fill="#0f172a" font-size="17" font-family="Verdana, sans-serif">
      publicly disclosed
    </text>
  </g>

  <g transform="translate(280 142)">
    <rect width="170" height="120" rx="16" fill="#fde68a" stroke="#d97706" stroke-width="5"/>
    <text x="85" y="40" text-anchor="middle" fill="#92400e" font-size="20" font-family="Verdana, sans-serif" font-weight="700">
      Mar 9
    </text>
    <text x="85" y="72" text-anchor="middle" fill="#0f172a" font-size="17" font-family="Verdana, sans-serif">
      Internal alert
    </text>
    <text x="85" y="96" text-anchor="middle" fill="#0f172a" font-size="17" font-family="Verdana, sans-serif">
      patch not completed
    </text>
  </g>

  <g transform="translate(490 142)">
    <rect width="170" height="120" rx="16" fill="#fee2e2" stroke="#dc2626" stroke-width="5"/>
    <text x="85" y="40" text-anchor="middle" fill="#991b1b" font-size="20" font-family="Verdana, sans-serif" font-weight="700">
      May 13
    </text>
    <text x="85" y="72" text-anchor="middle" fill="#0f172a" font-size="17" font-family="Verdana, sans-serif">
      Attackers enter
    </text>
    <text x="85" y="96" text-anchor="middle" fill="#0f172a" font-size="17" font-family="Verdana, sans-serif">
      ACIS via Struts
    </text>
  </g>

  <g transform="translate(700 142)">
    <rect width="170" height="120" rx="16" fill="#fecdd3" stroke="#e11d48" stroke-width="5"/>
    <text x="85" y="40" text-anchor="middle" fill="#9f1239" font-size="20" font-family="Verdana, sans-serif" font-weight="700">
      May to July
    </text>
    <text x="85" y="72" text-anchor="middle" fill="#0f172a" font-size="17" font-family="Verdana, sans-serif">
      Web shells, creds,
    </text>
    <text x="85" y="96" text-anchor="middle" fill="#0f172a" font-size="17" font-family="Verdana, sans-serif">
      lateral access
    </text>
  </g>

  <g transform="translate(910 142)">
    <rect width="120" height="120" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="5"/>
    <text x="60" y="40" text-anchor="middle" fill="#166534" font-size="20" font-family="Verdana, sans-serif" font-weight="700">
      Jul 29
    </text>
    <text x="60" y="72" text-anchor="middle" fill="#0f172a" font-size="17" font-family="Verdana, sans-serif">
      Breach
    </text>
    <text x="60" y="96" text-anchor="middle" fill="#0f172a" font-size="17" font-family="Verdana, sans-serif">
      discovered
    </text>
  </g>

  <g stroke="#0f172a" stroke-width="5" fill="none" stroke-linecap="round">
    <line x1="240" y1="202" x2="280" y2="202" marker-end="url(#arrow)"/>
    <line x1="450" y1="202" x2="490" y2="202" marker-end="url(#arrow)"/>
    <line x1="660" y1="202" x2="700" y2="202" marker-end="url(#arrow)"/>
    <line x1="870" y1="202" x2="910" y2="202" marker-end="url(#arrow)"/>
  </g>

  <g transform="translate(150 338)">
    <rect width="800" height="196" rx="20" fill="#e2e8f0"/>
    <text x="400" y="40" text-anchor="middle" fill="#0f172a" font-size="24" font-family="Verdana, sans-serif" font-weight="700">
      What made the breach worse
    </text>
    <text x="400" y="78" text-anchor="middle" fill="#334155" font-size="19" font-family="Verdana, sans-serif">
      Known vulnerability + missed patching + poor segmentation
    </text>
    <text x="400" y="104" text-anchor="middle" fill="#334155" font-size="19" font-family="Verdana, sans-serif">
      <tspan x="400" dy="0">+ unencrypted credentials + weakened monitoring</tspan>
      <tspan x="400" dy="22">from an expired certificate</tspan>
    </text>
    <text x="400" y="152" text-anchor="middle" fill="#334155" font-size="19" font-family="Verdana, sans-serif">
      = 76 days of attacker access before detection
    </text>
  </g>

  <g transform="translate(422 540)">
    <rect width="256" height="44" rx="12" fill="#111827"/>
    <text x="128" y="29" text-anchor="middle" fill="#f8fafc" font-size="18" font-family="Verdana, sans-serif" font-weight="700">
      Public disclosure: Sep 7, 2017
    </text>
  </g>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 10 5, 0 10" fill="#0f172a"/>
    </marker>
  </defs>
</svg>
