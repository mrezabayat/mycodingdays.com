<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">ILOVEYOU email worm illustration</title>
  <desc id="desc">A stylized email inbox showing the ILOVEYOU lure and its automatic spread to Outlook contacts.</desc>
  <rect width="1000" height="620" fill="#fff7ed"/>
  <text x="500" y="58" text-anchor="middle" fill="#7c2d12" font-size="30" font-family="Verdana, sans-serif" font-weight="700">
    ILOVEYOU turned one click into many emails
  </text>

  <g transform="translate(84 118)">
    <rect width="552" height="346" rx="18" fill="#ffffff" stroke="#7c2d12" stroke-width="5"/>
    <rect width="552" height="54" rx="18" fill="#fed7aa"/>
    <text x="28" y="34" fill="#7c2d12" font-size="22" font-family="Verdana, sans-serif" font-weight="700">Inbox</text>
    <text x="38" y="102" fill="#0f172a" font-size="18" font-family="Verdana, sans-serif">From: someone you know</text>
    <text x="38" y="138" fill="#0f172a" font-size="20" font-family="Verdana, sans-serif" font-weight="700">Subject: ILOVEYOU</text>
    <text x="38" y="174" fill="#334155" font-size="18" font-family="Verdana, sans-serif">
      kindly check the attached LOVELETTER coming from me.
    </text>
    <rect x="38" y="206" width="260" height="70" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="4"/>
    <text x="168" y="233" text-anchor="middle" fill="#7f1d1d" font-size="16" font-family="Verdana, sans-serif" font-weight="700">
      <tspan x="168" dy="0">LOVE-LETTER-FOR-YOU</tspan>
      <tspan x="168" dy="18">.TXT.vbs</tspan>
    </text>
    <path d="M362 244 h128" stroke="#dc2626" stroke-width="5" stroke-dasharray="10 8" marker-end="url(#arrowRed)"/>
    <text x="420" y="226" text-anchor="middle" fill="#7f1d1d" font-size="18" font-family="Verdana, sans-serif">Open attachment</text>

    <g transform="translate(414 206)">
      <rect width="102" height="82" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="4"/>
      <text x="51" y="32" text-anchor="middle" fill="#92400e" font-size="18" font-family="Verdana, sans-serif" font-weight="700">Script runs</text>
      <text x="51" y="58" text-anchor="middle" fill="#92400e" font-size="15" font-family="Verdana, sans-serif">send to</text>
      <text x="51" y="76" text-anchor="middle" fill="#92400e" font-size="15" font-family="Verdana, sans-serif">all contacts</text>
    </g>
  </g>

  <g transform="translate(704 132)">
    <rect width="220" height="294" rx="18" fill="#ffffff" stroke="#1f2937" stroke-width="5"/>
    <rect width="220" height="50" rx="18" fill="#e5e7eb"/>
    <text x="110" y="32" text-anchor="middle" fill="#111827" font-size="20" font-family="Verdana, sans-serif" font-weight="700">Outlook Contacts</text>

    <g fill="#111827" font-size="18" font-family="Verdana, sans-serif">
      <text x="26" y="88">Amina</text>
      <text x="26" y="124">Ben</text>
      <text x="26" y="160">Chris</text>
      <text x="26" y="196">Dana</text>
      <text x="26" y="232">Elena</text>
    </g>

    <g stroke="#db2777" stroke-width="4" fill="none">
      <line x1="146" y1="82" x2="194" y2="82" marker-end="url(#arrowPink)"/>
      <line x1="146" y1="118" x2="194" y2="118" marker-end="url(#arrowPink)"/>
      <line x1="146" y1="154" x2="194" y2="154" marker-end="url(#arrowPink)"/>
      <line x1="146" y1="190" x2="194" y2="190" marker-end="url(#arrowPink)"/>
      <line x1="146" y1="226" x2="194" y2="226" marker-end="url(#arrowPink)"/>
    </g>

    <text x="110" y="268" text-anchor="middle" fill="#7e22ce" font-size="17" font-family="Verdana, sans-serif">
      <tspan x="110" dy="0">Same message,</tspan>
      <tspan x="110" dy="20">repeated automatically</tspan>
    </text>
  </g>

  <text x="500" y="536" text-anchor="middle" fill="#7c2d12" font-size="20" font-family="Verdana, sans-serif">
    The lure looked personal, the sender looked familiar, and the mail client did the scaling.
  </text>

  <defs>
    <marker id="arrowRed" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 10 5, 0 10" fill="#dc2626"/>
    </marker>
    <marker id="arrowPink" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 10 5, 0 10" fill="#db2777"/>
    </marker>
  </defs>
</svg>
